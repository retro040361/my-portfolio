<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!-- 分頁圖示：RETRO_OS 的噴漆 R（SVG 優先，舊瀏覽器用 ICO） -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f19" />
    <meta
      name="description"
      content="Retro 的個人網站：EDA 軟體工程師、GNN 研究、技術筆記、生活隨筆與演唱會/遊戲紀錄。"
    />

    <!-- 社群分享預覽 (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Retro's Space" />
    <meta property="og:description" content="EDA 軟體工程師 Retro 的個人網站：技術筆記、生活隨筆、專案與遊戲演唱會紀錄。" />
    <meta property="og:image" content="https://retro040361.github.io/my-portfolio/image/gojo.webp" />
    <meta property="og:url" content="https://retro040361.github.io/my-portfolio/" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- 字型：內文與標題 Chakra Petch（中文 fallback 到 Noto Sans TC）、終端機元素 JetBrains Mono / VT323 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&family=VT323&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- 在 React 載入前先套用主題，避免閃白 -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <title>Retro's Space</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
